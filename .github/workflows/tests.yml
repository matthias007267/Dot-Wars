name: Tests

on:
  # Ein PR-Test genügt; Push-Tests auf Feature-Branches würden dieselbe Suite doppelt ausführen.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Godot 4.3 installieren
        run: |
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Projekt importieren
        run: timeout 60s godot --headless --path . --import

      - name: Tests
        run: timeout 180s godot --headless --path . -s tests/run_tests.gd

      - name: Hauptszene startet
        run: |
          timeout 30s godot --headless --path . --quit-after 8 > /tmp/boot.log 2>&1
          cat /tmp/boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Startprüfung fehlgeschlagen|Konfiguration ungültig" /tmp/boot.log; then
            exit 1
          fi
          grep -q "DOT WARS bereit" /tmp/boot.log
