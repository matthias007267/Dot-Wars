name: Tests

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Godot 4.3 installieren
        run: |
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Projekt importieren
        run: godot --headless --path . --import

      - name: Tests
        run: godot --headless --path . -s tests/run_tests.gd

      - name: Hauptszene startet
        run: |
          godot --headless --path . --quit-after 8 > /tmp/boot.log 2>&1 || true
          cat /tmp/boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Startprüfung fehlgeschlagen|Konfiguration ungültig" /tmp/boot.log; then
            exit 1
          fi
          grep -q "DOT WARS bereit" /tmp/boot.log
