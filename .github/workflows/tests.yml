name: Tests

on:
  # Ein PR-Test genügt; Push-Tests auf Feature-Branches würden dieselbe Suite doppelt ausführen.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # Explicit bash enables pipefail, preserving Godot/timeout failures through tee.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Godot 4.3 installieren
        run: |
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Nativen Rechenkern bauen
        run: bash native/build.sh

      - name: Projekt importieren
        run: timeout 120s godot --headless --path . --import

      - name: Tests
        run: |
          timeout 300s godot --headless --path . -s tests/run_tests.gd -- --require-native 2>&1 | tee /tmp/tests-native.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|SHADER ERROR|Shader compilation failed|shader_compiler.cpp" /tmp/tests-native.log; then
            exit 1
          fi

      - name: GDScript-Fallback testen
        run: |
          timeout 600s godot --headless --path . -s tests/run_tests.gd -- --no-native 2>&1 | tee /tmp/tests-reference.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|SHADER ERROR|Shader compilation failed|shader_compiler.cpp" /tmp/tests-reference.log; then
            exit 1
          fi

      - name: Hauptszene startet
        run: |
          timeout 30s godot --headless --path . --quit-after 8 > /tmp/boot.log 2>&1
          cat /tmp/boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Startprüfung fehlgeschlagen|Konfiguration ungültig" /tmp/boot.log; then
            exit 1
          fi
          grep -q "DOT WARS bereit" /tmp/boot.log

      - name: Grafischer P6-Bediencheck
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri
          fi
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x1000x24" timeout 90s godot --audio-driver Dummy --path . -s bench/p6_live_check.gd 2>&1 | tee /tmp/p6-live.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|SHADER ERROR|Shader compilation failed|shader_compiler.cpp" /tmp/p6-live.log; then
            exit 1
          fi
          grep -q "P6 LIVE SUMMARY: 0 failures" /tmp/p6-live.log

      - name: P6-Grafiknachweise
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-visual-check
          path: |
            /tmp/p6-live.log
            /tmp/p6-research-tree.png
            /tmp/p6-powered.png
            /tmp/p6-world.png
          if-no-files-found: ignore

      - name: Cavern-Optik und HUD prüfen
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x1000x24" timeout 90s godot --audio-driver Dummy --path . -s bench/cavern_visual_check.gd 2>&1 | tee /tmp/cavern-visual.log
          if grep -E "SCRIPT ERROR|Parse Error|SHADER ERROR|Shader compilation failed|shader_compiler.cpp" /tmp/cavern-visual.log; then
            exit 1
          fi
          grep -q "CAVERN SUMMARY: 0 failures" /tmp/cavern-visual.log

      - name: Cavern-Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cavern-visual-check
          path: |
            /tmp/cavern-visual.log
            /tmp/cavern-overview.png
            /tmp/cavern-research.png
            /tmp/cavern-detail.png
            /tmp/cavern-compact.png
          if-no-files-found: ignore

      - name: Sprite-Atlas und Zustandsanimationen prüfen
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x1000x24" timeout 90s godot --audio-driver Dummy --path . -s bench/sprite_visual_check.gd 2>&1 | tee /tmp/sprite-visual.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|SHADER ERROR|Shader compilation failed|shader_compiler.cpp" /tmp/sprite-visual.log; then
            exit 1
          fi
          grep -q "SPRITE SUMMARY: 0 failures" /tmp/sprite-visual.log

      - name: Sprite-Grafiknachweise
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprite-visual-check
          path: |
            /tmp/sprite-visual.log
            /tmp/sprite-*.png
          if-no-files-found: ignore

      - name: Steinboden und Abbauhistorie prüfen
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x1000x24" timeout 90s godot --audio-driver Dummy --path . -s bench/floor_visual_check.gd 2>&1 | tee /tmp/floor-visual.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|SHADER ERROR|Shader compilation failed|shader_compiler.cpp" /tmp/floor-visual.log; then
            exit 1
          fi
          grep -q "FLOOR SUMMARY: 0 failures" /tmp/floor-visual.log

      - name: Boden-Grafiknachweis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floor-visual-check
          path: |
            /tmp/floor-visual.log
            /tmp/floor-comparison.png
          if-no-files-found: ignore
